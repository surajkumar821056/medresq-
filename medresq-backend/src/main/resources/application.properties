spring.application.name=medresq-backend

# ---- Active profile ----
# Default is PostgreSQL. Run with -Dspring-boot.run.profiles=h2 (or set
# SPRING_PROFILES_ACTIVE=h2) to use an in-memory H2 database instead
# (zero setup, data resets on restart) while you're getting things running.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ---- MySQL (default profile) ----
spring.datasource.url=jdbc:mysql://localhost:3306/medresq?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=suraj@821056
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
# CHANGE THIS in a real deployment - move to an environment variable.
app.jwt.secret=medresq-dev-secret-key-change-me-please-this-should-be-at-least-256-bits-long
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Vite dev server default port
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

server.port=8080
